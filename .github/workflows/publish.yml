name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        shell: pwsh
        run: Test-ModuleManifest ./fsvc.psd1 | Out-Null

      - name: Run tests
        shell: pwsh
        run: |
          $fail = 0
          foreach ($t in Get-ChildItem tests/*.Tests.ps1) {
            pwsh -NonInteractive -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          if ($fail -ne 0) { exit 1 }

      - name: Install PSResourceGet
        shell: pwsh
        run: Install-Module Microsoft.PowerShell.PSResourceGet -Force -Scope CurrentUser

      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-PSResource -Path . -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
